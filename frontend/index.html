<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherGPT — Conversational Weather & Local Alerts</title>
<style>
:root{
  --bg1:#060d1f; --bg2:#0b1a38; --card:rgba(15,27,54,.72); --card2:rgba(30,52,98,.55);
  --line:rgba(120,170,255,.16); --text:#e8eefc; --dim:#8fa2c8; --accent:#38b6ff; --accent2:#7c6bff;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --warnbg:rgba(251,191,36,.14); --badbg:rgba(248,113,113,.14);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(124,107,255,.28), transparent 60%),
    radial-gradient(1000px 500px at -10% 110%, rgba(56,182,255,.22), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg2));
  background-attachment:fixed; overflow:hidden;
}
.app{display:flex; height:100vh; width:100vw}
/* ---------- left rail ---------- */
.rail{width:280px; min-width:280px; border-right:1px solid var(--line); background:rgba(6,13,31,.6); backdrop-filter:blur(14px); display:flex; flex-direction:column; padding:18px 14px; gap:14px; overflow:hidden}
.brand{display:flex; align-items:center; gap:10px; padding:2px 4px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid; place-items:center; font-size:20px; box-shadow:0 6px 18px rgba(56,182,255,.35)}
.brand h1{font-size:18px; font-weight:700; letter-spacing:.3px}
.brand small{display:block; color:var(--dim); font-size:11px; font-weight:400}
.saved h3{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin-bottom:8px; padding:0 4px}
.locs{display:flex; flex-direction:column; gap:8px; overflow-y:auto; min-height:0; flex:1}
.loc{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; cursor:pointer; transition:.15s}
.loc:hover{border-color:var(--accent); transform:translateY(-1px)}
.loc .pin{font-size:18px}
.loc .nm{flex:1; font-size:14px; font-weight:600}
.loc button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:8px}
.loc button:hover{color:var(--bad);background:var(--badbg)}
.locform{display:flex; gap:8px}
.locform input{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--text); font-size:13px; outline:none}
.locform input:focus{border-color:var(--accent)}
.locform button{width:40px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; border-radius:10px; color:#fff; font-size:18px; cursor:pointer}
.rail .foot{margin-top:auto; font-size:11px; color:var(--dim); padding:6px 4px; border-top:1px solid var(--line)}
.rail .foot b{color:var(--good)}
/* ---------- main ---------- */
.main{flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line); background:rgba(6,13,31,.35); backdrop-filter:blur(10px)}
.topbar .status{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim); min-width:0}
.topbar .status .dot{width:8px;height:8px;border-radius:50%;background:var(--good); box-shadow:0 0 8px var(--good); animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.topbar select, .topbar .iconb{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 12px; font-size:13px; outline:none; cursor:pointer}
.topbar .iconb{width:40px; display:grid; place-items:center; font-size:16px; transition:.15s}
.topbar .iconb:hover{border-color:var(--accent)}
.bell{position:relative}
.bell .badge{position:absolute; top:-5px; right:-5px; background:var(--bad); color:#fff; font-size:10px; min-width:17px; height:17px; border-radius:9px; display:none; place-items:center; padding:0 4px; font-weight:700}
/* chat */
.chat{flex:1; overflow-y:auto; padding:22px 22px 10px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth}
.msg{max-width:76%; display:flex; flex-direction:column; gap:6px; animation:up .25s ease}
@keyframes up{from{opacity:0; transform:translateY(8px)}}
.msg.user{align-self:flex-end; align-items:flex-end}
.msg.bot{align-self:flex-start; align-items:flex-start}
.bubble{padding:12px 16px; border-radius:16px; font-size:14px; line-height:1.5; white-space:pre-wrap; overflow-wrap:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#1b66c9,#6a52e8); border-bottom-right-radius:5px}
.msg.bot .bubble{background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px; box-shadow:0 8px 24px rgba(0,0,0,.25)}
.msg .meta{font-size:11px; color:var(--dim); padding:0 4px; display:flex; gap:8px; align-items:center}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:8px 14px; font-size:12.5px; cursor:pointer; transition:.15s}
.chip:hover{border-color:var(--accent); background:var(--card); transform:translateY(-1px)}
.typing{display:inline-flex; gap:5px; padding:14px 18px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.2; transform:translateY(0)}50%{opacity:1; transform:translateY(-4px)}}
/* input */
.inputbar{display:flex; gap:10px; padding:14px 22px 20px; border-top:1px solid var(--line); background:rgba(6,13,31,.6); backdrop-filter:blur(10px)}
.inputbar input{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 18px; color:var(--text); font-size:14px; outline:none}
.inputbar input:focus{border-color:var(--accent)}
.inputbar .send{width:48px; border:none; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:18px; cursor:pointer; transition:.15s}
.inputbar .send:hover{filter:brightness(1.15)}
.inputbar .mic{width:48px; border:1px solid var(--line); border-radius:14px; background:var(--card2); color:var(--text); font-size:17px; cursor:pointer; transition:.15s}
.inputbar .mic.recording{background:var(--badbg); border-color:var(--bad); color:var(--bad); animation:pulse 1.2s infinite}
/* tool chip inside bot bubble */
.tooltag{display:inline-flex; align-items:center; gap:6px; background:rgba(56,182,255,.12); border:1px solid rgba(56,182,255,.3); color:#aadcff; font-size:11px; border-radius:999px; padding:4px 10px; align-self:flex-start; margin-bottom:2px}
.tick{color:var(--good); font-size:12px}
.time{font-size:10.5px; opacity:.75}
/* alerts panel */
.alerts{position:fixed; top:70px; right:18px; width:340px; max-height:60vh; overflow-y:auto; z-index:50; display:none; flex-direction:column; gap:10px}
.alerts.show{display:flex; animation:up .25s ease}
.alertcard{border-radius:14px; padding:12px 14px; font-size:13px; border:1px solid; box-shadow:0 10px 30px rgba(0,0,0,.35); background:var(--card)}
.alertcard.warning{border-color:var(--bad); background:var(--badbg)}
.alertcard.watch{border-color:var(--warn); background:var(--warnbg)}
.alertcard .head{display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:4px}
.alertcard .msg{line-height:1.45; font-size:12.5px}
.alertcard .sub{font-size:10.5px; opacity:.7; margin-top:6px}
/* muted voice */
.voicehint{font-size:10.5px; color:var(--dim); padding:0 4px}
/* responsive */
@media (max-width:820px){
  .rail{display:none}
  .msg{max-width:90%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="logo">🌦️</div>
      <h1>WeatherGPT<small>Conversational Weather & Alerts</small></h1>
    </div>
    <div class="saved">
      <h3>📍 Saved locations <span id="locCount" style="color:var(--accent)"></span></h3>
      <div class="locs" id="locList"></div>
      <form class="locform" id="locForm">
        <input id="locInput" placeholder="Add a city… e.g. Chennai" autocomplete="off">
        <button type="submit" title="Track this location">＋</button>
      </form>
    </div>
    <div class="foot">Live data: <b>Open-Meteo</b> · Forecaster: <b id="llmName">gpt-oss-120b</b><br>IMD-style alerts every 15 min · Telegram push optional</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="status"><span class="dot"></span><span id="statusText">Live · Open-Meteo</span></div>
      <div style="flex:1"></div>
      <select id="langSel" title="Response language"></select>
      <button class="iconb" id="simBtn" title="Simulate a live weather alert">🚨</button>
      <button class="iconb" id="bellBtn" title="Alerts">🔔<span class="badge" id="bellBadge"></span></button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="inputbar">
      <button class="mic" id="micBtn" title="Voice input (Hindi/English)">🎤</button>
      <input id="chatInput" placeholder="Ask about the weather anywhere in India…" autocomplete="off">
      <button class="send" id="sendBtn" title="Send">➤</button>
    </div>
    <div class="voicehint" id="voiceHint" style="text-align:center"></div>
  </main>
</div>

<div class="alerts" id="alertsPanel"></div>

<script>
const $ = s => document.querySelector(s);
const API = { chat:"/api/chat", locs:"/api/locations", alerts:"/api/alerts", langs:"/api/languages", health:"/api/health" };
const CLIENT_ID = (localStorage.getItem("wcg_client") || "client-" + Math.random().toString(36).slice(2,9));
localStorage.setItem("wcg_client", CLIENT_ID);

let lang = localStorage.getItem("wcg_lang") || "en";
let LANG_NAMES = {};
let history = [];
let currentLangLabel = "";

const chatEl = $("#chat"), inputEl = $("#chatInput"), sendBtn = $("#sendBtn"),
      micBtn = $("#micBtn"), langSel = $("#langSel"), bellBtn = $("#bellBtn"),
      alertsPanel = $("#alertsPanel"), bellBadge = $("#bellBadge"), locList = $("#locList"),
      locForm = $("#locForm"), locInput = $("#locInput"), voiceHint = $("#voiceHint");

/* ---------------- languages ---------------- */
async function loadLangs(){
  try{
    const r = await fetch(API.langs); const d = await r.json();
    LANG_NAMES = d.languages;
    langSel.innerHTML = Object.entries(d.languages)
      .map(([k,v]) => `<option value="${k}">${v.native} · ${v.name}</option>`).join("");
    langSel.value = lang;
  }catch(e){}
}
function detectScriptLang(text){
  const m={ "\u0900-\u097F":"hi","\u0980-\u09FF":"bn","\u0B00-\u0B7F":"or","\u0B80-\u0BFF":"ta",
    "\u0C00-\u0C7F":"te","\u0C80-\u0CFF":"kn","\u0D00-\u0D7F":"ml","\u0A80-\u0AFF":"gu","\u0A00-\u0A7F":"pa" };
  for(const r in m){ if(new RegExp("["+r+"]").test(text)) return m[r]; }
  return /aaj|kal|mausam|kya|hai|kuchh|garmi|sardi|barish/i.test(text) ? "hi" : lang;
}

/* ---------------- chat ---------------- */
function addMsg(text, who, opts={}){
  const wrap = document.createElement("div");
  wrap.className = "msg " + who;
  const meta = document.createElement("div"); meta.className = "meta";
  const t = document.createElement("span"); t.className="time";
  t.textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  meta.appendChild(t);
  let bubble = document.createElement("div"); bubble.className = "bubble";
  bubble.textContent = text;
  wrap.appendChild(bubble); wrap.appendChild(meta);
  if(opts.tools && opts.tools.length){
    const tags = document.createElement("div"); tags.style.display="flex"; tags.style.flexWrap="wrap"; tags.style.gap="6px";
    opts.tools.forEach(t => {
      const chip = document.createElement("span"); chip.className="tooltag";
      chip.innerHTML = `<span class="tick">✔</span> ${fancyName(t.name || t)} <span style="opacity:.55">· ${fmtInput(t.arguments||{})}</span>`;
      tags.appendChild(chip);
    });
    wrap.insertBefore(tags, bubble);
  }
  if(opts.hint){ const h=document.createElement("div"); h.className="voicehint"; h.textContent=opts.hint; wrap.appendChild(h);}
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}
function fancyName(t){ return ({get_current_weather:"current",get_forecast:"forecast",get_historical_trend:"climate trend",get_weather_alerts:"alert check",get_air_quality:"air quality"})[t] || t.replace("_"," "); }
function fmtInput(a){ return (a.location && a.location.replace(/^./,c=>c.toUpperCase())) || ""; }
function typing(on){
  let el = $("#typingEl");
  if(on && !el){ el=document.createElement("div"); el.id="typingEl"; el.className="msg bot"; el.innerHTML='<div class="bubble typing"><span></span><span></span><span></span></div>'; chatEl.appendChild(el); chatEl.scrollTop=chatEl.scrollHeight; }
  if(!on && el) el.remove();
}
async function send(text){
  text=(text||"").trim(); if(!text) return;
  lang = detectScriptLang(text);
  langSel.value = lang;
  inputEl.value="";
  addMsg(text,"user");
  typing(true); sendBtn.disabled=true;
  try{
    const r = await fetch(API.chat,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text, language:lang, client_id:CLIENT_ID, history:history.slice(-8)})});
    const d = await r.json();
    typing(false);
    addMsg(d.answer, "bot", {tools:d.tools||[], hint:d.hint, lang:d.language});
    history.push({role:"user",content:text},{role:"assistant",content:d.answer});
    if(history.length>20) history = history.slice(-20);
    speak(d.answer, d.language || lang);
    loadLocations();
  }catch(e){
    typing(false);
    addMsg("⚠️ Couldn't reach the backend. Is the server running?", "bot");
  }
  sendBtn.disabled=false;
  inputEl.focus();
}

/* ---------------- locations ---------------- */
async function loadLocations(){
  try{
    const r = await fetch(API.locs+"?client_id="+CLIENT_ID); const d = await r.json();
    $("#locCount").textContent = d.locations.length ? "("+d.locations.length+")" : "";
    locList.innerHTML = "";
    d.locations.forEach(l=>{
      const row=document.createElement("div"); row.className="loc";
      row.innerHTML = `<span class="pin">📍</span><span class="nm">${esc(l.name)}</span>`;
      row.addEventListener("click", () => send("Weather in "+l.name));
      const del=document.createElement("button"); del.textContent="✕"; del.title="Remove";
      del.addEventListener("click", async e=>{ e.stopPropagation();
        await fetch(API.locs+"/"+l.id+"?client_id="+CLIENT_ID,{method:"DELETE"}); loadLocations(); });
      row.appendChild(del); locList.appendChild(row);
    });
    const no = document.createElement("div");
    if(!d.locations.length){ no.className="voicehint"; no.style.padding="6px 4px"; no.textContent="No saved places yet — add a city to start receiving proactive alerts."; locList.appendChild(no); }
  }catch(e){}
}
locForm.addEventListener("submit", async e=>{ e.preventDefault();
  const name = locInput.value.trim(); if(!name) return;
  const r = await fetch(API.locs,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:CLIENT_ID, location:name})});
  const d = await r.json();
  if(d.location) { locInput.value=""; loadLocations(); send("Weather in "+d.location.name); }
  else if(d.detail){ addMsg("⚠️ "+d.detail,"bot"); }
});

/* ---------------- alerts ---------------- */
async function loadAlerts(){
  try{
    const r = await fetch(API.alerts+"?client_id="+CLIENT_ID); const d = await r.json();
    const severe = d.alerts.filter(a=>a.severity==="warning").length;
    bellBadge.style.display = severe ? "grid" : "none";
    bellBadge.textContent = severe;
  }catch(e){}
}
function renderAlertsPanel(alerts){
  if(!alerts || !alerts.length){ alertsPanel.innerHTML = '<div class="alertcard" style="border-color:var(--line)">✅ No active weather alerts for your saved places.</div>'; return; }
  alertsPanel.innerHTML = alerts.map(a=>`
    <div class="alertcard ${a.severity}">
      <div class="head">${a.severity==="warning"?"🔴":"🟡"} ${esc(a.title||"Weather alert")}</div>
      <div class="msg">${esc(a.message||"")}</div>
      <div class="sub">${esc(a.place||"")} · ${new Date(a.ts).toLocaleString()}</div>
    </div>`).join("");
}
bellBtn.addEventListener("click", async ()=>{
  const r = await fetch(API.alerts+"?client_id="+CLIENT_ID); const d = await r.json();
  renderAlertsPanel(d.alerts);
  alertsPanel.classList.toggle("show");
});
$("#simBtn").addEventListener("click", async ()=>{
  try{
    await fetch(API.alerts+"/test?client_id="+CLIENT_ID,{method:"POST"});
  }catch(e){}
});
document.addEventListener("click", e=>{ if(!alertsPanel.contains(e.target) && e.target!==bellBtn) alertsPanel.classList.remove("show"); });

/* ---------------- websocket live push ---------------- */
function wsConnect(){
  const proto = location.protocol==="https:"?"wss":"ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws?client_id=${CLIENT_ID}`);
  ws.onmessage = (ev)=>{
    const d = JSON.parse(ev.data);
    if(d.type==="alert"){ loadAlerts(); if(alertsPanel.classList.contains("show")) renderAlertsPanel([d.alert]);
      addMsg(`🔔 ${d.alert.title}\n${d.alert.message}`, "bot");
    }
  };
  ws.onclose = ()=> setTimeout(wsConnect, 8000);
  setInterval(()=>{ if(ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:"ping"})); }, 30000);
}

/* ---------------- voice (Web Speech API — works in Chrome/Edge) ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening=false;
const LANG2S = {en:"en-IN", hi:"hi-IN", mr:"hi-IN", bn:"bn-IN", ta:"ta-IN", te:"te-IN", kn:"kn-IN", ml:"ml-IN", gu:"gu-IN", pa:"pa-IN", or:"or-IN"};
micBtn.addEventListener("click", ()=>{
  if(!SR){ addMsg("Voice input needs Chrome or Edge — your browser doesn't support Web Speech API.", "bot"); return; }
  if(listening){ rec.stop(); return; }
  if(!rec){ rec = new SR(); rec.lang = LANG2S[lang]||"en-IN"; rec.continuous=false; rec.interimResults=false;
    rec.onresult = ev=>{ voiceHint.textContent=""; const t = ev.results[0][0].transcript; inputEl.value=t; send(t); };
    rec.onerror = e=>{ voiceHint.textContent="🎤 "+(e.error==="not-allowed"?"Microphone blocked":"Try again"); micBtn.classList.remove("recording"); listening=false; };
    rec.onend = ()=>{ micBtn.classList.remove("recording"); listening=false; };
  }
  rec.lang = LANG2S[lang]||"en-IN";
  voiceHint.textContent="🎤 Listening… speak now";
  rec.start(); listening=true; micBtn.classList.add("recording");
});
function speak(text, l){
  if(!("speechSynthesis" in window)) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.lang = LANG2S[l]||"en-IN"; u.rate=1; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

/* ---------------- glue ---------------- */
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
$("#chatInput").addEventListener("keydown", e=>{ if(e.key==="Enter") send(e.target.value); });
sendBtn.addEventListener("click", ()=> send(inputEl.value));
langSel.addEventListener("change", ()=>{ lang = langSel.value; localStorage.setItem("wcg_lang", lang); });

const suggestions=[
  "What's the weather right now in Delhi?",
  "5-day forecast for Mumbai",
  "Heavy rain alert in Chennai?",
  "Is it hotter than last year in Bengaluru?",
  "Air quality in Pune",
];
const chipRow = document.createElement("div"); chipRow.className="chips"; chipRow.style.padding="0 22px 6px";
chipRow.innerHTML = suggestions.map(s=>`<button class="chip">${esc(s)}</button>`).join("");
chipRow.addEventListener("click", e=>{ if(e.target.classList.contains("chip")) send(e.target.textContent); });
$(".chat").parentNode.insertBefore(chipRow, $(".chat").nextSibling);

(async function init(){
  await loadLangs();
  loadLocations(); loadAlerts(); wsConnect();
  try{ const h=await fetch(API.health); const d=await h.json();
       $("#statusText").textContent = d.llm_configured ? "Live · LLM ready" : "Live · offline router mode (set LLM_API_KEY)";
  }catch(e){}
  setTimeout(()=>{
    const langCode = detectScriptLang(""); 
    addMsg("नमस्ते! 👋 मैं हूँ WeatherGPT — your weather copilot for India.\n\nAsk me anything — current weather, multi-day forecasts, historic climate trends, or check for weather alerts. I reply in your language and even read alerts out loud.\n\nTry the chips above, or tap 🎤 to talk.",
      "bot");
  }, 350);
  inputEl.focus();
})();
</script>
</body>
</html>
